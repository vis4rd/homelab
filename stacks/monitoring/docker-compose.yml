services:

  # MARK: GLANCES (HOST MONITORING)
  glances:
    image: nicolargo/glances:4.5.8-full
    container_name: glances
    restart: unless-stopped
    pid: host
    environment:
      TZ: Europe/Warsaw
      GLANCES_OPT: "-w -C /etc/glances/glances.conf"
    volumes:
      - ./glances/config:/etc/glances:ro
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:61208/api/4/status"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - frontend

  glances-exporter:
    image: nicolargo/glances:4.5.8-full
    container_name: glances-exporter
    restart: unless-stopped
    pid: host
    environment:
      TZ: Europe/Warsaw
      GLANCES_OPT: "--export prometheus -C /etc/glances/glances.conf"
    volumes:
      - ./glances/config:/etc/glances:ro
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:9091/"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - frontend

  # MARK: PROMETHEUS (METRICS STORAGE)
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    restart: unless-stopped
    extra_hosts:
      - host.docker.internal:host-gateway
    volumes:
      - ./prometheus/config:/etc/prometheus:ro
      - prometheus_data:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=30d
      - --web.enable-lifecycle
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9090/-/healthy"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - frontend

  # MARK: GRAFANA (DASHBOARDS)
  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    restart: unless-stopped
    env_file:
      - ./grafana/.env
      # Required fields in './newt/.env':
      # GF_SECURITY_ADMIN_USER     = Username for the admin user
      # GF_SECURITY_ADMIN_PASSWORD = Password for the admin user
    environment:
      GF_SERVER_ROOT_URL: http://grafana.home.arpa
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/config/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/config/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      prometheus:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - frontend

  # MARK: BLACKBOX EXPORTER (DNS AND HTTP PROBES)
  blackbox-exporter:
    image: prom/blackbox-exporter:latest
    container_name: blackbox-exporter
    restart: unless-stopped
    command:
      - --config.file=/etc/blackbox_exporter/blackbox.yml
    volumes:
      - ./blackbox/config:/etc/blackbox_exporter:ro
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9115/metrics"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - frontend

  # MARK: DOCKHAND (DOCKER DASHBOARD)
  dockhand:
    image: fnsys/dockhand:latest
    container_name: dockhand
    restart: always
    ports:
      - 9443:3000
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - dockhand_data:/app/data
      - /home/homelab/homelab:/home/homelab/homelab
    networks:
      - frontend

volumes:
  dockhand_data:
    name: dockhand_data
  prometheus_data:
    name: prometheus_data
  grafana_data:
    name: grafana_data

networks:
  frontend:
    name: frontend
    external: true
