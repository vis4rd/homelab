global:
  scrape_interval: 30s
  evaluation_interval: 30s

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: [prometheus:9090]

  - job_name: glances
    static_configs:
      - targets: [glances-exporter:9091]

  - job_name: caddy
    static_configs:
      - targets: [caddy:2019]

  - job_name: dreeve
    metrics_path: /metrics
    static_configs:
      - targets: [dreeve:2019]

  - job_name: blackbox-exporter
    static_configs:
      - targets: [blackbox-exporter:9115]

  - job_name: blackbox-http
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets:
          - http://caddy:2019/metrics
          - http://seerr:5055/api/v1/settings/public
          - http://homepage:3000
          - http://dockhand:3000
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115

  - job_name: blackbox-dns
    metrics_path: /probe
    params:
      module: [dns_udp]
    static_configs:
      - targets:
          - pihole:53
          - 192.168.1.1:53
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115
