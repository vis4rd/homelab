global:
  scrape_interval: 30s
  evaluation_interval: 30s

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: [prometheus:9090]

  - job_name: glances
    static_configs:
      - targets: [glances-exporter:9091]

  - job_name: caddy
    static_configs:
      - targets: [caddy:2019]

  - job_name: dreeve
    metrics_path: /metrics
    static_configs:
      - targets: [dreeve:2019]

  - job_name: jellyfin-json-exporter
    metrics_path: /probe
    params:
      module: [jellyfin_movies]
    static_configs:
      - targets:
          [
            "http://jellyfin:8096/Items?IncludeItemTypes=Movie&Recursive=true&Limit=0&EnableTotalRecordCount=true",
          ]
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: json-exporter:7979

  - job_name: jellyfin-json-exporter-series
    metrics_path: /probe
    params:
      module: [jellyfin_series]
    static_configs:
      - targets:
          [
            "http://jellyfin:8096/Items?IncludeItemTypes=Series&Recursive=true&Limit=0&EnableTotalRecordCount=true",
          ]
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: json-exporter:7979

  - job_name: jellyfin-json-exporter-users
